name: Reset Firestore (Production Cleanup)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ "YES" เพื่อยืนยันการลบข้อมูลทั้งหมด'
        required: true
        default: ''

jobs:
  reset:
    name: Clear Firestore Test Data
    runs-on: ubuntu-latest

    steps:
      - name: Verify confirmation (must be exactly "YES")
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "YES" ]; then
            echo "❌ ยืนยันไม่ถูกต้อง — ต้องพิมพ์ YES (ตัวพิมพ์ใหญ่เท่านั้น) จึงจะลบข้อมูลได้"
            exit 1
          fi
          echo "✅ ยืนยันแล้ว — เริ่มลบข้อมูล Firestore"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: .github/scripts

      - name: Reset Firestore data
        run: node .github/scripts/reset-firestore.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
