name: Reset Firestore (Production Cleanup)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ "YES" เพื่อยืนยันการลบข้อมูลทั้งหมด'
        required: true
        default: ''

# Serializes concurrent manual runs instead of letting them race against each
# other (two admins triggering this close together, or a double-click) —
# queues the second run rather than cancelling it, since this workflow
# performs a destructive, non-idempotent-to-interrupt cleanup.
concurrency:
  group: reset-firestore
  cancel-in-progress: false

jobs:
  reset:
    name: Clear Firestore Test Data
    runs-on: ubuntu-latest
    # This job serializes behind the shared `reset-firestore` concurrency
    # group above — without a timeout, a single hung step would block every
    # subsequent legitimate run behind it (including a real deploy sharing
    # no group with this one, but any other reset attempt) for up to
    # GitHub's 6-hour default.
    timeout-minutes: 10
    # only reads the repo + talks to Firestore via the Admin SDK service
    # account — no GITHUB_TOKEN scope is ever needed
    permissions:
      contents: read

    steps:
      # CONFIRM is passed via env, never spliced directly into the script
      # text — interpolating ${{ github.event.inputs.confirm }} straight into
      # the `run:` block (the previous form) is a classic GitHub Actions
      # script-injection pattern: a crafted input value like
      # `x" ]; then :; fi; curl ...; if [ "x` can break out of the `[ ]` test
      # and run arbitrary shell in this job, which later receives
      # FIREBASE_SERVICE_ACCOUNT as an env var.
      - name: Verify confirmation (must be exactly "YES")
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "YES" ]; then
            echo "❌ ยืนยันไม่ถูกต้อง — ต้องพิมพ์ YES (ตัวพิมพ์ใหญ่เท่านั้น) จึงจะลบข้อมูลได้"
            exit 1
          fi
          echo "✅ ยืนยันแล้ว — เริ่มลบข้อมูล Firestore"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .github/scripts

      - name: Reset Firestore data
        run: node .github/scripts/reset-firestore.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
