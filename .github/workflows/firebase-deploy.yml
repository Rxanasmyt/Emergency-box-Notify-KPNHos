name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - claude/eloquent-heisenberg-vqrypu
      - main
      - master

# All three trigger branches deploy to the SAME Firebase Hosting live channel
# and the same Firestore rules target — without this, two pushes landing on
# different branches close together (e.g. a merge fast-forwarding main right
# after a direct push to the dev branch) could run two deploy jobs
# concurrently with no ordering guarantee, letting the OLDER commit's deploy
# finish last and silently overwrite the newer commit's hosting/rules
# deploy with stale content. Queue instead of racing; do not cancel an
# in-progress deploy mid-way (a half-applied Firestore rules deploy is worse
# than a delayed one).
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Firebase Hosting + Firestore Rules Deploy
    runs-on: ubuntu-latest
    # This job serializes behind the shared `firebase-deploy` concurrency
    # group above (cancel-in-progress: false) — without a timeout, a single
    # hung step (a stuck registry fetch, an auth call that never resolves)
    # would block every subsequent legitimate deploy behind it for up to
    # GitHub's 6-hour default, with no indication why. 15 minutes is
    # generously above this job's normal ~1 minute runtime.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # This app has no build step, so nothing catches a syntax error in
      # index.html's inline <script> (the entire app) before it goes out to
      # the real production hospital site — until now, a bad edit would
      # deploy straight through with zero warning, only discovered when
      # someone opened a blank/broken page. Blocks the deploy steps below if
      # this fails.
      - name: Verify index.html syntax
        run: node .github/scripts/check-syntax.js

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: emergencyboxnotyfykpnhos
          channelId: live

      # Firestore security rules only — this NEVER touches/deletes any document
      # data. Rules only control who is allowed to read/write/delete going
      # forward; existing boxes/box_drugs/audit_log/users records are untouched.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Pinned to an exact version, not @latest — this app committed a
      # package-lock.json + switched to `npm ci` for .github/scripts
      # specifically to close this exact class of gap (an unreviewed
      # version bump silently pulling a compromised/buggy release); this
      # `npx @latest` line was the one place that discipline didn't reach,
      # and it runs immediately after Application Default Credentials for a
      # real GCP service account (Firebase Rules Admin + Service Usage
      # Consumer) are already in scope. Bump deliberately, not silently.
      - name: Deploy Firestore security rules
        run: npx firebase-tools@15.28.1 deploy --only firestore:rules --project emergencyboxnotyfykpnhos --non-interactive
