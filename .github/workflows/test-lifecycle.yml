name: Test Lifecycle (safe, temp box)

on:
  workflow_dispatch:

jobs:
  test:
    name: Register/Dispense/Return smoke test against a throwaway TEST-1 box
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: .github/scripts

      - name: Run lifecycle smoke test
        run: node .github/scripts/test-lifecycle.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Guaranteed cleanup even if the step above is cancelled (e.g. someone
      # clicks "Cancel workflow" mid-run) or the runner is killed before the
      # script's own .finally()-based cleanup gets to execute — GitHub
      # Actions still runs if: always() steps after a cancellation, so this
      # is the only way to guarantee TEST-1 never lingers in production
      # Firestore, where it would show up as a real, selectable box
      # indistinguishable from EB-1..EB-10 in the live app.
      - name: Guaranteed cleanup (runs even if the test above was cancelled)
        if: always()
        run: node .github/scripts/test-lifecycle.js --cleanup-only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
