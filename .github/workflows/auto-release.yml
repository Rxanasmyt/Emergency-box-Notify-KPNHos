name: Auto Tag & Release

on:
  push:
    branches:
      - claude/eloquent-heisenberg-vqrypu
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    # No job in any workflow in this repo previously set a timeout, so a
    # single hung step (e.g. a stuck `git push` of the new tag) would run
    # until GitHub's 6-hour default kicks in.
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          LATEST=$(git tag -l "v*" | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest tag: ${LATEST}"

      - name: Bump patch version
        id: bump
        run: |
          LATEST="${{ steps.get_tag.outputs.latest }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          # Check commit message for version bump type
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -q "^feat!:\|^BREAKING"; then
            MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
          elif echo "$MSG" | grep -q "^feat:"; then
            MINOR=$((MINOR+1)); PATCH=0
          else
            PATCH=$((PATCH+1))
          fi
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "New tag: ${NEW_TAG}"

      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

      # github.event.head_commit.message is attacker-influenceable (a squash-merge
      # commonly defaults its message to an external PR's title, fully controlled
      # by whoever opened the PR) — read it via env: (never spliced with ${{ }}
      # into the run: script body, same discipline reset-data.yml already uses for
      # its confirm input) and reduce it to a single sanitized line before it ever
      # reaches the public release body, so it can't inject stray markdown/links
      # into the project's release notes.
      - name: Sanitize commit summary for release notes
        id: commit_summary
        env:
          RAW_MSG: ${{ github.event.head_commit.message }}
        run: |
          SAFE=$(printf '%s' "$RAW_MSG" | head -n 1 | tr -d '[]()' | cut -c1-200)
          echo "text=${SAFE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: "${{ steps.bump.outputs.new_tag }} — Emergency Box Management"
          body: |
            ## ${{ steps.bump.outputs.new_tag }}

            **Commit:** ${{ steps.commit_summary.outputs.text }}
            **Branch:** `${{ github.ref_name }}`
            **SHA:** `${{ github.sha }}`

            ---
            ระบบจัดการ Emergency Box · โรงพยาบาลกรงปินัง
          draft: false
          prerelease: false
