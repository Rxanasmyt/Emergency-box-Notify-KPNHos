name: Daily Drug Expiry Notification

on:
  schedule:
    - cron: '0 20 * * *'  # ตั้ง 03:00 น. ไทย (UTC+7 → 20:00 UTC วันก่อน) เผื่อ GH delay ~5 ชม. → ถึงมือ ~08:00 น.
  workflow_dispatch:        # กดรันมือได้จาก GitHub Actions tab

jobs:
  notify:
    name: Check Expiry & Send Alerts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: .github/scripts

      - name: Run expiry check & send notifications
        run: node .github/scripts/check-expiry.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LINE_CHANNEL_TOKEN:       ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID:             ${{ secrets.LINE_USER_ID }}
          EMAIL_FROM:               ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS:               ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:                 ${{ secrets.EMAIL_TO }}
          NOTIFY_DAYS_AHEAD:        ${{ vars.NOTIFY_DAYS_AHEAD || '30' }}
