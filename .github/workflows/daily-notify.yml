name: Daily Drug Expiry Notification

on:
  schedule:
    # สำรองเท่านั้น — GitHub เริ่มรัน schedule ช้า 6-10 ชม. จริง (09:00 → ~16:00-19:00 น.)
    # ตัวหลักคือตัวตั้งเวลาภายนอก (cron-job.org) ที่สั่ง workflow_dispatch ตอน 09:00 น. ไทย
    # และส่งซ้ำไม่ได้: สคริปต์เช็ค lastDailyRunDate ว่ารอบวันนี้ทำเสร็จแล้วหรือยัง
    # ใช้นาทีที่ไม่ใช่ :00 เพราะต้นชั่วโมงเป๊ะ ๆ คือช่วงที่คิวของ GitHub แน่นที่สุด
    - cron: '17 2 * * *'
  workflow_dispatch:        # กดรันมือได้จาก GitHub Actions tab / ปุ่มในแอป / ตัวตั้งเวลาภายนอก
    inputs:
      source:
        description: 'manual = ส่งทันทีเสมอ | scheduler = รอบประจำวันจากตัวตั้งเวลาภายนอก (ส่งวันละครั้ง)'
        required: false
        default: 'manual'
        type: string

# serialize runs so an external-scheduler run and a late GitHub-cron run can
# never execute at the same time and both pass the once-per-day check
concurrency:
  group: daily-notify
  cancel-in-progress: false

jobs:
  notify:
    name: Check Expiry & Send Alerts
    runs-on: ubuntu-latest
    # No job in any workflow in this repo previously set a timeout, so a
    # single hung step (a stuck npm registry fetch, a Firestore/SMTP call
    # that never resolves) would run until GitHub's 6-hour default kicks in.
    # This one runs daily on a cron — a stuck run could also delay/skip the
    # next scheduled trigger.
    timeout-minutes: 10
    # this job only reads the repo and talks to Firestore/LINE/email via its
    # own secrets — it never needs any GITHUB_TOKEN scope, so pin it to
    # read-only instead of inheriting the org/repo's default token permissions
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .github/scripts

      - name: Run expiry check & send notifications
        run: node .github/scripts/check-expiry.js
        env:
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MOPH_NOTIFY_CLIENT_KEY:    ${{ secrets.MOPH_NOTIFY_CLIENT_KEY }}
          MOPH_NOTIFY_SECRET_KEY:    ${{ secrets.MOPH_NOTIFY_SECRET_KEY }}
          EMAIL_FROM:                ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS:                ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:                  ${{ secrets.EMAIL_TO }}
          NOTIFY_DAYS_AHEAD:         ${{ vars.NOTIFY_DAYS_AHEAD || '60' }}
          SOURCE:                    ${{ github.event.inputs.source || 'manual' }}
