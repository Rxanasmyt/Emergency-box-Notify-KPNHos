name: Daily Drug Expiry Notification

on:
  schedule:
    - cron: '0 2 * * *'   # 09:00 น. ไทย (UTC+7 → 02:00 UTC)
  workflow_dispatch:        # กดรันมือได้จาก GitHub Actions tab

jobs:
  notify:
    name: Check Expiry & Send Alerts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: .github/scripts

      - name: Run expiry check & send notifications
        run: node .github/scripts/check-expiry.js
        env:
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MOPH_NOTIFY_CLIENT_KEY:    ${{ secrets.MOPH_NOTIFY_CLIENT_KEY }}
          MOPH_NOTIFY_SECRET_KEY:    ${{ secrets.MOPH_NOTIFY_SECRET_KEY }}
          EMAIL_FROM:                ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS:                ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:                  ${{ secrets.EMAIL_TO }}
          NOTIFY_DAYS_AHEAD:         ${{ vars.NOTIFY_DAYS_AHEAD || '60' }}
