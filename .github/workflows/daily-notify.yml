name: Daily Drug Expiry Notification

on:
  schedule:
    - cron: '0 2 * * *'   # 09:00 น. ไทย (UTC+7 → 02:00 UTC)
  workflow_dispatch:        # กดรันมือได้จาก GitHub Actions tab

jobs:
  notify:
    name: Check Expiry & Send Alerts
    runs-on: ubuntu-latest
    # No job in any workflow in this repo previously set a timeout, so a
    # single hung step (a stuck npm registry fetch, a Firestore/SMTP call
    # that never resolves) would run until GitHub's 6-hour default kicks in.
    # This one runs daily on a cron — a stuck run could also delay/skip the
    # next scheduled trigger.
    timeout-minutes: 10
    # this job only reads the repo and talks to Firestore/LINE/email via its
    # own secrets — it never needs any GITHUB_TOKEN scope, so pin it to
    # read-only instead of inheriting the org/repo's default token permissions
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .github/scripts

      - name: Run expiry check & send notifications
        run: node .github/scripts/check-expiry.js
        env:
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MOPH_NOTIFY_CLIENT_KEY:    ${{ secrets.MOPH_NOTIFY_CLIENT_KEY }}
          MOPH_NOTIFY_SECRET_KEY:    ${{ secrets.MOPH_NOTIFY_SECRET_KEY }}
          EMAIL_FROM:                ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS:                ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:                  ${{ secrets.EMAIL_TO }}
          NOTIFY_DAYS_AHEAD:         ${{ vars.NOTIFY_DAYS_AHEAD || '60' }}
